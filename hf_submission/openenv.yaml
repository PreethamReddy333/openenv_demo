name: compliance_checker
version: "1.0.0"
description: >
  Regulatory Compliance Checker — An RL environment where AI agents audit product
  feature descriptions for regulatory violations (GDPR, HIPAA, SOC2). The agent must
  identify violations, classify severity, cite the correct regulation article, and
  suggest actionable remediations. Features keyword-based grading with partial credit,
  duplicate detection, and an efficiency bonus.

author: Team Daedalus
tags:
  - openenv
  - compliance
  - regulatory
  - gdpr
  - hipaa
  - soc2
  - legal
  - audit

tasks:
  - id: easy
    name: "GDPR Basics"
    description: "Identify 3 obvious GDPR violations in a simple product feature (newsletter signup or analytics dashboard). Single regulation family."
    difficulty: easy
    max_steps: 8
    num_violations: 3
    regulations: ["GDPR"]

  - id: medium
    name: "Healthcare Compliance"
    description: "Identify 5 violations across GDPR and HIPAA in a healthcare/enterprise product (telehealth portal or employee wellness platform). Multiple regulation families with subtle violations."
    difficulty: medium
    max_steps: 12
    num_violations: 5
    regulations: ["GDPR", "HIPAA"]

  - id: hard
    name: "Enterprise AI Audit"
    description: "Identify 7 violations across GDPR, HIPAA, and SOC2 in a complex AI/IoT system (AI insurance processor or smart building system). Ambiguous violations requiring deep regulatory knowledge."
    difficulty: hard
    max_steps: 15
    num_violations: 7
    regulations: ["GDPR", "HIPAA", "SOC2"]

action_space:
  type: ComplianceAction
  fields:
    - name: violation_id
      type: string
      description: "Regulation clause violated (e.g., GDPR-Art7, HIPAA-Security, SOC2-CC6)"
    - name: violation_description
      type: string
      description: "What is wrong and why it violates the regulation"
    - name: severity
      type: string
      enum: ["critical", "high", "medium", "low"]
      description: "Severity classification of the violation"
    - name: suggested_fix
      type: string
      description: "Concrete, actionable remediation"

observation_space:
  type: ComplianceObservation
  fields:
    - name: task_id
      type: string
    - name: feature_description
      type: string
    - name: applicable_regulations
      type: "List[string]"
    - name: findings_so_far
      type: "List[Dict]"
    - name: remaining_violations
      type: integer
    - name: feedback
      type: string
    - name: max_steps_remaining
      type: integer

reward:
  range: [0.0, 1.0]
  type: composite
  components:
    coverage: 0.60
    quality: 0.25
    efficiency: 0.15
  description: >
    Episode score = 60% violation coverage + 25% finding quality + 15% step efficiency.
    Step rewards: 0.4 base for correct match, +0.2 correct regulation, +0.2 correct severity,
    +0.1 quality fix, +0.1 strong keyword match. Duplicate submissions penalized (-0.1).
